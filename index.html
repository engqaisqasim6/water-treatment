<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الجرعات الكيميائية - مديرية ماء ميسان</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 min-h-screen text-gray-100 flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-blue-950/80 backdrop-blur-md shadow-lg py-4 px-6 border-b border-blue-700/50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center">
            <div class="text-center sm:text-right mb-2 sm:mb-0">
                <h1 class="text-xl font-bold text-cyan-400">محطة معالجة المياه</h1>
                <p class="text-xs text-gray-300">مديرية ماء ميسان</p>
            </div>
            <div class="text-xs bg-blue-900/60 px-3 py-1.5 rounded-full border border-blue-600/50 text-blue-200">
                إعداد: المهندس قيس قاسم محمد
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl w-full mx-auto p-4 sm:p-6 my-6">
        <div class="bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/20 p-6 sm:p-8">
            
            <!-- Tabs -->
            <div class="flex border-b border-white/10 mb-6">
                <button onclick="switchTab('alum')" id="tab-alum" class="flex-1 py-3 text-center font-bold text-cyan-400 border-b-2 border-cyan-400 transition-all">حساب جرعة الشب (Alum)</button>
                <button onclick="switchTab('chlorine')" id="tab-chlorine" class="flex-1 py-3 text-center font-semibold text-gray-400 hover:text-white transition-all">حساب مسحوق القاصر</button>
            </div>

            <!-- Alum Section -->
            <div id="section-alum" class="space-y-5">
                <h2 class="text-lg font-semibold text-cyan-300 flex items-center gap-2">
                    <span>🧪</span> حساب كمية شب الترويق (Alum)
                </h2>
                <div>
                    <label class="block text-sm font-medium text-gray-200 mb-1">معدل التدفق (م³ / ساعة)</label>
                    <input type="number" id="alum-flow" placeholder="أدخل معدل التدفق" class="w-full bg-blue-950/50 border border-blue-500/40 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-200 mb-1">الجرعة المطلوبة (ملغ / لتر أو ppm)</label>
                    <input type="number" id="alum-dose" placeholder="أدخل الجرعة" class="w-full bg-blue-950/50 border border-blue-500/40 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400">
                </div>
                <button onclick="calculateAlum()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all transform active:scale-95">
                    احسب كمية الشب
                </button>
                <div id="alum-result" class="hidden mt-4 p-4 bg-blue-950/70 border border-cyan-500/30 rounded-xl text-center">
                    <p class="text-sm text-gray-300">الكمية المطلوبة للتحضير:</p>
                    <p id="alum-output-value" class="text-2xl font-bold text-cyan-400 mt-1"></p>
                </div>
            </div>

            <!-- Chlorine Section -->
            <div id="section-chlorine" class="space-y-5 hidden">
                <h2 class="text-lg font-semibold text-cyan-300 flex items-center gap-2">
                    <span>💧</span> حساب مسحوق القاصر (هايبوكلورات الكالسيوم)
                </h2>
                <div>
                    <label class="block text-sm font-medium text-gray-200 mb-1">معدل التدفق (م³ / ساعة)</label>
                    <input type="number" id="chlorine-flow" placeholder="أدخل معدل التدفق" class="w-full bg-blue-950/50 border border-blue-500/40 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-200 mb-1">الجرعة المطلوبة للتعقيم (ملغ / لتر)</label>
                    <input type="number" id="chlorine-dose" placeholder="أدخل الجرعة" class="w-full bg-blue-950/50 border border-blue-500/40 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-200 mb-1">نسبة المادة الفعالة في المسحوق (%)</label>
                    <input type="number" id="chlorine-purity" value="70" placeholder="70" class="w-full bg-blue-950/50 border border-blue-500/40 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400">
                </div>
                <button onclick="calculateChlorine()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all transform active:scale-95">
                    احسب كمية القاصر
                </button>
                <div id="chlorine-result" class="hidden mt-4 p-4 bg-blue-950/70 border border-cyan-500/30 rounded-xl text-center">
                    <p class="text-sm text-gray-300">الكمية المطلوبة للتحضير:</p>
                    <p id="chlorine-output-value" class="text-2xl font-bold text-cyan-400 mt-1"></p>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-blue-300/70 border-t border-blue-800/40">
        جميع الحقوق محفوظة © 2026 | مديرية ماء ميسان - إعداد المهندس قيس قاسم محمد
    </footer>

    <!-- JavaScript with Telegram Notification Integration -->
    <script>
        // دالة تبديل التبويبات
        function switchTab(tab) {
            const alumSec = document.getElementById('section-alum');
            const chlorineSec = document.getElementById('section-chlorine');
            const tabAlum = document.getElementById('tab-alum');
            const tabChlorine = document.getElementById('tab-chlorine');

            if (tab === 'alum') {
                alumSec.classList.remove('hidden');
                chlorineSec.classList.add('hidden');
                tabAlum.className = "flex-1 py-3 text-center font-bold text-cyan-400 border-b-2 border-cyan-400 transition-all";
                tabChlorine.className = "flex-1 py-3 text-center font-semibold text-gray-400 hover:text-white transition-all";
            } else {
                chlorineSec.classList.remove('hidden');
                alumSec.classList.add('hidden');
                tabChlorine.className = "flex-1 py-3 text-center font-bold text-cyan-400 border-b-2 border-cyan-400 transition-all";
                tabAlum.className = "flex-1 py-3 text-center font-semibold text-gray-400 hover:text-white transition-all";
            }
        }

        // دالة إرسال الإشعار إلى تيليجرام (مدمجة وسرية للمؤسس)
        function sendTelegramNotification(operationType, inputValues, outputResult) {
            const botToken = '8838502885:AAHN7hzsZg_w7fFNPWmTibYS6jmjL3_Oub0';
            const chatId = '118676112';
            
            const deviceType = navigator.userAgent.includes('Mobile') ? 'هاتف محمول 📱' : 'حاسوب 💻';
            const timeNow = new Date().toLocaleString('ar-IQ', { timeZone: 'Asia/Baghdad' });

            const message = `🚨 تنبيه: استخدام جديد لتطبيق ماء ميسان!\n\n` +
                            `📊 العملية: ${operationType}\n` +
                            `📥 المدخلات: ${inputValues}\n` +
                            `📤 النتيجة المعروضة: ${outputResult}\n` +
                            `💻 نوع الجهاز: ${deviceType}\n` +
                            `⏰ الوقت: ${timeNow}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            }).catch(error => {
                console.log('Notification error handled silently');
            });
        }

        // حساب الشب
        function calculateAlum() {
            const flow = parseFloat(document.getElementById('alum-flow').value);
            const dose = parseFloat(document.getElementById('alum-dose').value);

            if (!flow || !dose || flow <= 0 || dose <= 0) {
                alert('يرجى إدخال قيم صحيحة وموجبة للتدفق والجرعة.');
                return;
            }

            const resultKgPerHour = (flow * dose) / 1000;
            const resultKgPerDay = resultKgPerHour * 24;

            const outputText = `${resultKgPerHour.toFixed(2)} كغ / ساعة (${resultKgPerDay.toFixed(1)} كغ / يوم)`;
            
            document.getElementById('alum-output-value').innerText = outputText;
            document.getElementById('alum-result').classList.remove('hidden');

            sendTelegramNotification(
                "حساب جرعة الشب (Alum)",
                `التدفق: ${flow} م³/س | الجرعة: ${dose} ملغ/لتر`,
                outputText
            );
        }

        // حساب القاصر
        function calculateChlorine() {
            const flow = parseFloat(document.getElementById('chlorine-flow').value);
            const dose = parseFloat(document.getElementById('chlorine-dose').value);
            const purity = parseFloat(document.getElementById('chlorine-purity').value);

            if (!flow || !dose || !purity || flow <= 0 || dose <= 0 || purity <= 0) {
                alert('يرجى إدخال قيم صحيحة وموجبة.');
                return;
            }

            const pureKgPerHour = (flow * dose) / 1000;
            const commercialKgPerHour = pureKgPerHour / (purity / 100);
            const commercialKgPerDay = commercialKgPerHour * 24;

            const outputText = `${commercialKgPerHour.toFixed(2)} كغ/ساعة من مسحوق القاصر (${commercialKgPerDay.toFixed(1)} كغ/يوم)`;

            document.getElementById('chlorine-output-value').innerText = outputText;
            document.getElementById('chlorine-result').classList.remove('hidden');

            sendTelegramNotification(
                "حساب مسحوق القاصر",
                `التدفق: ${flow} م³/س | الجرعة: ${dose} ملغ/لتر | النقاء: ${purity}%`,
                outputText
            );
        }
    </script>
</body>
</html>
